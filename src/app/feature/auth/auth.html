<div class="flex min-h-screen items-center justify-center bg-gray-100 px-4">
  <div class="w-full max-w-md rounded-2xl bg-white p-8 shadow-lg">
    <!-- Header -->
    <div class="mb-8 text-center">
      <h1 class="text-2xl font-bold text-gray-800">Welcome Back</h1>

      <p class="mt-2 text-sm text-gray-500">Login to your account</p>
    </div>

    <!-- Error -->
    @if (errorMessage) {
      <div class="mb-4 rounded-lg bg-red-50 px-4 py-3 text-sm text-red-600">
        {{ errorMessage }}
      </div>
    }

    <!-- Form -->
    <form (ngSubmit)="login()" class="space-y-5">
      <!-- Username -->
      <div>
        <label class="mb-1 block text-sm font-medium text-gray-700"> Username </label>

        <input
          type="text"
          name="username"
          [(ngModel)]="username"
          placeholder="Enter username"
          required
          class="w-full rounded-lg border border-gray-300 px-4 py-3 text-sm outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100"
        />
      </div>

      <!-- Password -->
      <div>
        <label class="mb-1 block text-sm font-medium text-gray-700"> Password </label>

        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Enter password"
          required
          class="w-full rounded-lg border border-gray-300 px-4 py-3 text-sm outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100"
        />
      </div>

      <!-- Login Button -->
      <button
        type="submit"
        [disabled]="loading"
        class="w-full rounded-lg bg-indigo-600 px-4 py-3 text-sm font-medium text-white transition hover:bg-indigo-700 disabled:cursor-not-allowed disabled:opacity-50 cursor-pointer"
      >
        @if (loading) {
          Logging in...
        } @else {
          Login
        }
      </button>
    </form>
  </div>
</div>
