<div class="p-6">
  <!-- Header -->
  <div class="mb-6 flex items-center justify-between">
    <div>
      <h1 class="text-2xl font-semibold text-gray-800">Staff</h1>

      <p class="mt-1 text-sm text-gray-500">Manage your store staff</p>
    </div>

    <button
      (click)="createStaff()"
      class="cursor-pointer rounded-lg bg-indigo-600 px-4 py-2.5 text-sm font-medium text-white hover:bg-indigo-700"
    >
      Add Staff
    </button>
  </div>

  <!-- Table -->
  <div class="overflow-hidden rounded-xl border border-gray-200 bg-white">
    <div class="overflow-x-auto">
      <table class="w-full text-left text-sm">
        <thead class="border-b border-gray-200 bg-gray-50">
          <tr>
            <th class="px-6 py-4 font-semibold text-gray-600">#</th>

            <th class="px-6 py-4 font-semibold text-gray-600">Username</th>

            <th class="px-6 py-4 font-semibold text-gray-600">Role</th>

            <th class="px-6 py-4 text-right font-semibold text-gray-600">Actions</th>
          </tr>
        </thead>

        <tbody class="divide-y divide-gray-100">
          @for (staff of staffs; track staff.sId; let i = $index) {
            <tr class="hover:bg-gray-50">
              <!-- # -->
              <td class="px-6 py-4 text-gray-500">
                {{ i + 1 }}
              </td>

              <!-- Username -->
              <td class="px-6 py-4">
                <div class="flex items-center gap-3">
                  <div
                    class="flex h-9 w-9 items-center justify-center rounded-full bg-indigo-100 text-sm font-semibold text-indigo-600"
                  >
                    {{ staff.username.charAt(0).toUpperCase() }}
                  </div>

                  <span class="font-medium text-gray-800">
                    {{ staff.username }}
                  </span>
                </div>
              </td>

              <!-- Role -->
              <td class="px-6 py-4">
                <span
                  class="rounded-full bg-indigo-100 px-3 py-1 text-xs font-medium text-indigo-700 capitalize"
                >
                  {{ staff.role }}
                </span>
              </td>

              <!-- Actions -->
              <td class="px-6 py-4">
                <div class="flex justify-end gap-2">
                  <button
                    (click)="editStaff(staff)"
                    class="cursor-pointer rounded-lg px-3 py-2 text-sm font-medium text-indigo-600 hover:bg-indigo-50"
                  >
                    Edit
                  </button>

                  <button
                    (click)="deleteStaff(staff.sId)"
                    class="cursor-pointer rounded-lg px-3 py-2 text-sm font-medium text-red-600 hover:bg-red-50"
                  >
                    Delete
                  </button>
                </div>
              </td>
            </tr>
          }

          @if (staffs.length === 0) {
            <tr>
              <td colspan="4" class="px-6 py-10 text-center text-gray-500">No staff found.</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>

@if (showForm) {
  <app-staff-form
    [staff]="selectedStaff"
    (saved)="onSaved()"
    (cancelled)="closeForm()"
  ></app-staff-form>
}
